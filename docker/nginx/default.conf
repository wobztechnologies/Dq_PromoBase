server {
    # Fixed port for Railway (8080)
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /var/www/html/public;

    index index.php;

    charset utf-8;
    
    # Trust proxy headers from Railway load balancer
    # Railway uses a reverse proxy, so we trust all proxies
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Max upload size
    client_max_body_size 100M;

    # Special routes that must be handled by PHP-FPM first
    # Swagger/API documentation
    location ^~ /docs {
        try_files $uri /index.php?$query_string;
    }
    
    # Livewire routes
    location ^~ /livewire {
        try_files $uri /index.php?$query_string;
    }
    
    # Filament admin panel
    location ^~ /admin {
        try_files $uri /index.php?$query_string;
    }
    
    # Handle all requests - standard Laravel configuration
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health check endpoints for Railway
    # Railway healthcheck uses /health, Docker uses /up.php
    location = /health {
        try_files $uri /index.php?$query_string;
    }
    
    location = /up {
        try_files $uri /index.php?$query_string;
    }
    
    location = /up.php {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        
        # Forward proxy headers for Railway HTTPS detection
        # Railway sets these headers automatically
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param REQUEST_SCHEME $http_x_forwarded_proto;
        
        # Timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
        
        # Buffers
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
