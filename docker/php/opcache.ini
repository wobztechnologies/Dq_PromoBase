; OPcache configuration for Docker/Railway production
; Optimized for containerized deployments where code is immutable

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; In containers, code never changes after deployment
; So we disable timestamp validation for better performance
opcache.validate_timestamps=0

; Keep comments for annotations (Swagger, Doctrine, etc.)
opcache.save_comments=1

; File cache for better cold-start performance
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0
opcache.file_cache_consistency_checks=1

; Performance optimizations
opcache.fast_shutdown=1
opcache.enable_file_override=1
opcache.optimization_level=0x7FFEBFFF
