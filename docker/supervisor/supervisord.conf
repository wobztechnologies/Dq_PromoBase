[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; =============================================================================
; Laravel Initializer (runs once at startup, before other services)
; =============================================================================
[program:init]
command=/bin/sh -c "echo 'Starting Laravel initialization...' && php /var/www/html/artisan config:clear 2>&1 && php /var/www/html/artisan route:clear 2>&1 && php /var/www/html/artisan view:clear 2>&1 && php /var/www/html/artisan migrate --force --no-interaction 2>&1 && chmod -R 777 /var/www/html/storage/framework/sessions 2>&1 && chown -R www-data:www-data /var/www/html/storage/framework/sessions 2>&1 && php /var/www/html/artisan config:cache 2>&1 && php /var/www/html/artisan route:cache 2>&1 && php /var/www/html/artisan view:cache 2>&1 && (php /var/www/html/artisan storage:link 2>&1 || echo 'Storage link already exists') && echo 'Laravel initialization complete'"
autostart=true
autorestart=false
startsecs=0
priority=1
startretries=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; Nginx
; =============================================================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; PHP-FPM
; =============================================================================
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; Laravel Queue Worker
; =============================================================================
[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20
stopwaitsecs=60

; =============================================================================
; Laravel Scheduler
; =============================================================================
[program:scheduler]
command=/bin/sh -c "while [ true ]; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=20
