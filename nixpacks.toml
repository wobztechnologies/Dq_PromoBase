# Configuration Nixpacks pour Railway (alternative au Dockerfile)
# Non utilisé si railway.toml spécifie builder = "dockerfile"

[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_pgsql", "php83Extensions.redis", "php83Extensions.gd", "php83Extensions.intl", "php83Extensions.bcmath", "php83Extensions.zip", "nodejs_20", "nginx"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run build"
]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
