[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
watchPatterns = ["**/*"]

[deploy]
# Railway healthcheck endpoint
# Use /up.php for faster checks (bypasses Laravel, no DB required)
# This is faster and more reliable than /health which requires Laravel to be fully initialized
healthcheckPath = "/up.php"
healthcheckTimeout = 300

# Start command - Supervisor manages all services
startCommand = "/usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
